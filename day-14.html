    <meta charset="UTF-8" />

  <body>
    <h1>Advanced API Mini Projects</h1>

    <!-- 1. Typing Speed Tester -->
    <section>
      <h2>1. Typing Speed Tester</h2>
      <p id="sentence"></p>
      <textarea id="typingInput" placeholder="Start typing..."></textarea>
      <button onclick="startTyping()">Start Test</button>
      <div id="typingResult"></div>
    </section>

    <!-- 2. Air Quality Checker -->
    <section>
      <h2>2. Air Quality Checker</h2>
      <select id="cityAQI">
        <option value="Delhi">Delhi</option>
        <option value="London">London</option>
        <option value="New York">New York</option>
      </select>
      <button onclick="getAQI()">Check AQI</button>
      <div id="aqiResult"></div>
    </section>

    <!-- 3. GitHub User Finder -->
    <section>
      <h2>3. GitHub User Finder</h2>
      <input id="githubUser" placeholder="GitHub Username" />
      <button onclick="findGitHubUser()">Search</button>
      <div id="githubResult"></div>
    </section>

    <!-- 4. Currency Converter -->
    <section>
      <h2>4. Currency Converter</h2>
      <input id="amount" placeholder="Amount" type="number" />
      <select id="fromCurrency"></select>
      <select id="toCurrency"></select>
      <button onclick="convertCurrency()">Convert</button>
      <div id="currencyResult"></div>
    </section>

    <!-- 5. Dictionary App -->
    <section>
      <h2>5. Dictionary App</h2>
      <input id="wordInput" placeholder="Enter word" />
      <button onclick="searchWord()">Search</button>
      <div id="dictionaryResult"></div>
    </section>

    <!-- 6. NASA Picture of the Day -->
    <section>
      <h2>6. NASA Picture of the Day</h2>
      <input type="date" id="nasaDate" />
      <button onclick="loadNASA()">Load</button>
      <div id="nasaResult"></div>
    </section>
