  <head>
    <meta charset="UTF-8" />
    <title>Mini JavaScript Projects</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>JavaScript Mini Projects</h1>

    <!-- Mini Project 1: Click Counter -->
    <section>
      <h2>1. Click Counter App</h2>
      <p id="count">0</p>
      <button id="increment">Click Me</button>
      <button id="reset">Reset</button>
    </section>

    <!-- Mini Project 2: Image Preview -->
    <section>
      <h2>2. Image Preview Before Upload</h2>
      <input type="file" id="imageInput" accept="image/*" />
      <img id="preview" />
    </section>

    <!-- Mini Project 3: Keyboard Shortcut -->
    <section>
      <h2>3. Keyboard Shortcut Trigger</h2>
      <p id="shortcutMessage">Press Ctrl + S or Alt + M</p>
    </section>

    <!-- Mini Project 4: Quiz App -->
    <section>
      <h2>4. Quiz App</h2>
      <p id="question"></p>
      <div id="options"></div>
      <p id="score"></p>
    </section>

    <!-- Mini Project 5: Drag and Drop -->
    <section>
      <h2>5. Drag and Drop Box</h2>
      <div id="dropArea">
        <div id="dragBox" draggable="true">Drag me</div>
      </div>
    </section>

    <!-- Mini Project 6: Key Logger -->
    <section>
      <h2>6. Real-Time Key Logger</h2>
      <input type="text" id="keyInput" placeholder="Type something..." />
      <p>Last key pressed: <span id="lastKey"></span></p>
      <ul id="keyList"></ul>
    </section>
