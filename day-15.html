<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Error Handling Mini Projects</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1>Error Handling Mini Projects</h1>

    <!-- 1. User Registration Form -->
    <section>
      <h2>1. User Registration</h2>
      <input id="regName" placeholder="Name" />
      <input id="regEmail" placeholder="Email" />
      <button onclick="registerUser()">Register</button>
      <p id="regError" class="error"></p>
    </section>

    <!-- 2. API Response Logger -->
    <section>
      <h2>2. API Response Logger</h2>
      <button onclick="fetchAPI()">Fetch API</button>
      <p id="apiStatus"></p>
    </section>

    <!-- 3. Calculator -->
    <section>
      <h2>3. Calculator</h2>
      <input id="num1" type="number" />
      <input id="num2" type="number" />
      <button onclick="divide()">Divide</button>
      <p id="calcResult"></p>
    </section>

    <!-- 4. Debugging Dashboard -->
    <section>
      <h2>4. Debugging Dashboard</h2>
      <button onclick="showLogs()">Show Logs</button>
      <pre id="debugLogs"></pre>
    </section>

    <!-- 5. Form Validator -->
    <section>
      <h2>5. Advanced Form Validation</h2>
      <input id="vName" placeholder="Name" />
      <input id="vAge" placeholder="Age" />
      <input id="vEmail" placeholder="Email" />
      <input id="vPassword" placeholder="Password" />
      <button onclick="validateForm()">Validate</button>
      <p id="formError" class="error"></p>
    </section>

    <!-- 6. Error Logging System -->
    <section>
      <h2>6. Error Logger</h2>
      <input id="logMsg" placeholder="Message" />
      <select id="logType">
        <option value="log">Log</option>
        <option value="warn">Warn</option>
        <option value="error">Error</option>
      </select>
      <button onclick="addLog()">Add Log</button>
      <pre id="logOutput"></pre>
    </section>
