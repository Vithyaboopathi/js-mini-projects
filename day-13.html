  <body>
    <h1>API Based JavaScript Mini Projects</h1>

    <!-- 1. E-Commerce Product Catalog -->
    <section>
      <h2>1. E-Commerce Product Catalog</h2>
      <button onclick="filterByPrice()">Below $500</button>
      <button onclick="sortByPrice()">Sort Price ↑</button>
      <ul id="productList"></ul>
      <div id="productDetails"></div>
    </section>

    <!-- 2. Movie Search App -->
    <section>
      <h2>2. Movie Search App</h2>
      <input id="movieInput" placeholder="Enter movie title" />
      <button onclick="searchMovie()">Search</button>
      <div id="movieResult"></div>
    </section>

    <!-- 3. Weather App -->
    <section>
      <h2>3. Weather App</h2>
      <input id="cityInput" placeholder="Enter city" />
      <button onclick="getWeather()">Get Weather</button>
      <div id="weatherResult"></div>
    </section>

    <!-- 4. Employee Management -->
    <section>
      <h2>4. Employee Management System</h2>
      <input id="empName" placeholder="Employee Name" />
      <button onclick="addEmployee()">Add</button>
      <ul id="employeeList"></ul>
    </section>

    <!-- 5. Crypto Tracker -->
    <section>
      <h2>5. Crypto Tracker</h2>
      <ul id="cryptoList"></ul>
    </section>

    <!-- 6. Country Explorer -->
    <section>
      <h2>6. Country Explorer</h2>
      <input id="countrySearch" placeholder="Search country" />
      <select id="countryDropdown"></select>
      <div id="countryDetails"></div>
    </section>
